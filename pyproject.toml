[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "owlmatic-dashboard"
version = "0.1.0"
description = "Independent statistics receiver and dashboard for Owlmatic"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["starlette>=0.47,<2", "uvicorn>=0.35,<1", "pydantic>=2.11,<3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "mypy>=1.15", "ruff>=0.9", "build>=1.2", "types-PyYAML"]

[project.scripts]
owlmatic-dashboard = "owlmatic_dashboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/owlmatic_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
