name: Python quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m mypy
      - run: python -m pytest -q
      - run: python -m build
      - name: Verify isolated wheel
        run: |
          python -m venv "$RUNNER_TEMP/dashboard-wheel"
          "$RUNNER_TEMP/dashboard-wheel/bin/python" -m pip install dist/*.whl httpx
          cp tests/wheel_smoke.py "$RUNNER_TEMP/dashboard-wheel-smoke.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/dashboard-wheel/bin/python" -I dashboard-wheel-smoke.py
